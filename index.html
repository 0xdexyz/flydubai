<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b111a" />
    <meta name="description" content="FlyDubaiSim — relive flydubai flight FZ1073: a short cinematic 3D emergency-flight game: recover a diving airliner, divert to Tabuk and land it safely." />
    <title>FlyDubaiSim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b111a; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #04172a;
        color: #eef3f8; font: 600 14px/1.4 'Segoe UI', system-ui, sans-serif; transition: opacity .5s; }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-inner { text-align: center; }
      .boot-logo { display: block; width: 150px; height: auto; margin: 0 auto 10px; }
      .boot-title { font-size: 34px; letter-spacing: -.01em; font-weight: 800; margin-bottom: 18px; }
      .boot-bar { width: 220px; height: 3px; background: rgba(255,255,255,.1); margin: 0 auto 12px; overflow: hidden; border-radius: 2px; }
      .boot-bar i { display: block; height: 100%; width: 40%; background: #f28a1e; animation: boot 1.1s ease-in-out infinite; }
      .boot-sub { font-size: 11px; letter-spacing: .28em; color: #8c9aab; }
      .boot-error { max-width: 420px; padding: 24px; color: #ffd23f; letter-spacing: .02em; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="brand/favicon-180.png" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-inner">
        <img class="boot-logo" src="brand/logo-mark-glow.png" alt="" />
        <div class="boot-title">FlyDubai<span style="color:#f28a1e">SIM</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-sub">PREPARING AIRCRAFT</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
